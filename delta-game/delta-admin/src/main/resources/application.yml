spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}


app:
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

platform:
  customer-id: ${PLATFORM_CUSTOMER_ID:unconfigured}
  state-path: ${PLATFORM_STATE_PATH:./.local/platform/state.json}
  public-key-path: ${PLATFORM_PUBLIC_KEY_PATH:}
  report-url: ${PLATFORM_REPORT_URL:}

# Shared-service mode is opt-in. A tenant's database credentials belong in the protected
# deployment environment, never in this repository. Keep this disabled until the complete
# tenant migration and security checklist has passed.
tenant:
  enabled: ${TENANT_MODE_ENABLED:false}
  tenants: {}
