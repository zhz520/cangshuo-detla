# Upload the deployment ZIP contents to /www/delta before creating this stack.
# Absolute paths also work when BaoTa copies this file to its own compose directory.
services:
  mysql:
    image: mysql:8.0
    container_name: delta-mysql
    restart: unless-stopped
    env_file: /www/delta/.env
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    volumes:
      - /www/delta/data/mysql:/var/lib/mysql
      - /www/delta/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" -D delta_game -e 'SELECT 1 FROM admin LIMIT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [delta-game]

  redis:
    image: redis:7-alpine
    container_name: delta-redis
    restart: unless-stopped
    env_file: /www/delta/.env
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - /www/delta/data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [delta-game]

  backend:
    image: lenglengyou/delta-game:tagname
    platform: linux/amd64
    container_name: delta-backend
    restart: unless-stopped
    env_file: /www/delta/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /www/delta/data/upload:/www/data/upload
      - /www/delta/data/private/wxpay:/www/data/private/wxpay
    networks: [delta-game]

  admin:
    image: lenglengyou/delta-game-admin:tagname
    platform: linux/amd64
    container_name: delta-admin-ui
    restart: unless-stopped
    depends_on: [backend]
    ports: ["8081:80"]
    volumes:
      - /www/delta/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [delta-game]

  h5:
    image: lenglengyou/delta-game-h5:tagname
    platform: linux/amd64
    container_name: delta-h5
    restart: unless-stopped
    depends_on: [backend]
    ports: ["8082:80"]
    volumes:
      - /www/delta/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [delta-game]

networks:
  delta-game:
    driver: bridge
