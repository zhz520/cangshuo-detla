name: System validation

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Protect Actions storage
        run: python deploy/qa/check_ci_storage.py
      - name: Validate collaboration rules
        run: python deploy/qa/check_collaboration_rules.py
      - name: Validate AI project context
        run: python scripts/check_ai_context.py
      - name: Validate backend module boundaries
        run: python scripts/check_module_boundaries.py
      - name: Validate API contracts
        run: |
          python scripts/check_endpoint_baseline.py
          python scripts/check_openapi_baseline.py
          python scripts/check_openapi_types.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            delta-admin-ui/package-lock.json
            delta-mp/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: 'delta-game/**/pom.xml'
      - name: Test and build backend
        working-directory: delta-game
        run: mvn --batch-mode --settings ../.github/maven-settings.xml -pl delta-admin -am verify
      - name: Prepare MySQL money-path databases
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          python deploy/qa/workbench-mysql.py > "$RUNNER_TEMP/workbench-qa.sql"
          docker exec -i "$MYSQL_CONTAINER_ID" mysql -uroot < "$RUNNER_TEMP/workbench-qa.sql"
          python deploy/qa/withdraw-mysql.py > "$RUNNER_TEMP/withdraw-qa.sql"
          docker exec -i "$MYSQL_CONTAINER_ID" mysql -uroot < "$RUNNER_TEMP/withdraw-qa.sql"
          python deploy/qa/refund-workflow-mysql.py > "$RUNNER_TEMP/refund-workflow-qa.sql"
          docker exec -i "$MYSQL_CONTAINER_ID" mysql -uroot < "$RUNNER_TEMP/refund-workflow-qa.sql"
      - name: Test money paths on MySQL
        working-directory: delta-game
        env:
          WORKBENCH_TEST_MYSQL: '1'
          WITHDRAW_TEST_MYSQL: '1'
          ORDER_REFUND_TEST_MYSQL: '1'
          TEST_MYSQL_PORT: '3306'
        run: >-
          mvn --batch-mode --settings ../.github/maven-settings.xml -pl delta-admin -am
          -Dtest=WorkbenchIntegrationTest,AdminWithdrawConcurrencyTest,OrderRefundWorkflowTest
          -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Validate installer, shared release and rollback
        env:
          TEMP: ${{ runner.temp }}
        run: |
          python -m pip install cryptography==46.0.5
          python -m unittest discover -s deploy/updater -p 'test_*.py'
      - name: Validate migration file and finance checks
        env:
          TEMP: ${{ runner.temp }}
        run: python -m unittest discover -s deploy/migration -p 'test_*.py'
      - name: Install admin dependencies
        working-directory: delta-admin-ui
        run: npm ci
      - name: Build admin
        working-directory: delta-admin-ui
        run: |
          npm test
          npm run build
      - name: Install H5 dependencies
        working-directory: delta-mp
        run: npm ci
      - name: Build H5
        working-directory: delta-mp
        run: |
          npm test
          npm run build:h5
          npm run build:mp-weixin
      - name: Validate static asset references
        run: |
          python -m unittest discover -s deploy/qa -p 'test_*.py'
          python deploy/qa/check_static_assets.py delta-admin-ui/dist delta-mp/dist/build/h5
      # Formal release archives are generated and digest-checked separately.
      # Do not upload preview bundles on every push; they exhaust Actions storage.
